x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      UV_SYNC_ARGS: "--frozen --group production"
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-django}@db:5432/${POSTGRES_DB:-django}
    REDIS_URL: redis://redis:6379/0
    DB_HOST: db
    DB_PORT: "5432"
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
  volumes: &app-volumes
    - media_data:/app/media
  depends_on: &app-depends-on
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django}
      POSTGRES_USER: ${POSTGRES_USER:-django}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-django}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-django}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.25
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  django:
    <<: *app
    environment:
      <<: *app-env
      DJANGO_MIGRATE: "1"
      DJANGO_COMPILEMESSAGES: "1"
      DJANGO_COLLECTSTATIC: "0"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  celery:
    <<: *app
    command: celery -A config worker --loglevel=info

  celerybeat:
    <<: *app
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  redis_data:
  media_data:
