[project]
name = "django-template"
version = "0.1.0"
description = "Comprehensive template for Django projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django==6.0.8",
    "asgiref==3.12.1",
    "Pillow==12.3.0",
    "django-allauth==65.19.2",
    "django-filter==26.1",
    "django-extensions==4.1",
    "django-model-utils==5.0.0",
    "djangorestframework==3.18.1",
    "django-constance==4.3.5",
    "django-easy-audit==1.3.9",
    "django-widget-tweaks==1.5.1",
    "django-celery-beat==2.9.0",
    "django-sesame==3.2.3",
    "django-formtools==2.7",
    "django-cities-light==3.11",
    "django-autocomplete-light==5.0.0",
    "django-tailwind==4.5.0",
    "python-dotenv==1.2.3",
    "python-decouple==3.8",
    "dj-database-url==3.1.2",
    "redis==8.1.0",
    "celery==5.6.3",
    "requests==2.34.2",
    "setuptools==84.0.0",
    "honcho>=2.0.0",
]

[dependency-groups]
dev = [
    "django-debug-toolbar==8.0.0",
    "django-browser-reload==1.21.0",
    "ruff==0.16.6",
    "pre-commit==4.6.2",
    "Faker==40.38.0",
    "coverage==7.16.0",
    "factory_boy==3.3.3",
]
production = [
    "psycopg2-binary==2.9.12",
    "gunicorn==26.2.0",
    "whitenoise==6.12.0",
    "sentry-sdk>=2.69.1",
]
