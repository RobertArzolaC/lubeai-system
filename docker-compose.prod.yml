x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-django}:${POSTGRES_PASSWORD:-django}@db:5432/${POSTGRES_DB:-django}
  REDIS_URL: redis://redis:6379/0
  DB_HOST: db
  DB_PORT: "5432"
  DJANGO_SETTINGS_MODULE: config.settings.production
  DEBUG: "False"
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  SECRET_KEY: ${SECRET_KEY}
  EMAIL_HOST: ${EMAIL_HOST}
  EMAIL_PORT: ${EMAIL_PORT}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
  EMAIL_USE_TLS: "True"
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
  SENTRY_DSN: ${SENTRY_DSN}

services:
  django:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UV_SYNC_ARGS: "--frozen --no-dev --group production"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-3} --timeout 120 --access-logfile -
    environment:
      <<: *app-env
      DJANGO_MIGRATE: "1"
      DJANGO_COLLECTSTATIC: "1"
    ports:
      - "${DJANGO_PORT:-8000}:8000"

  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UV_SYNC_ARGS: "--frozen --no-dev --group production"
    environment:
      <<: *app-env

  celerybeat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UV_SYNC_ARGS: "--frozen --no-dev --group production"
    environment:
      <<: *app-env

  mailpit:
    profiles:
      - mailpit
