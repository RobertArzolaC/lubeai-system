{% extends "layouts/home.html" %}
{% load static %}
{% load i18n %}

{% block title_page %}{% trans "Access Denied" %}{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center gap-8 py-10 text-center">
    <div class="text-9xl font-black text-error/20">403</div>
    <div class="flex flex-col gap-2">
        <h1 class="text-3xl font-bold">{% trans "Forbidden" %}</h1>
        <p class="opacity-60">{% trans "You don't have permission to access this resource." %}</p>
    </div>
    <a href="/" class="btn btn-primary px-8">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        {% trans "Go back home" %}
    </a>
</div>
{% endblock content %}
