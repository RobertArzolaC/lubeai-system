{% load i18n %}

<div class="flex flex-col items-center p-20 text-center">
    <div class="mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-gray-2 dark:bg-meta-4">
        <svg class="h-12 w-12 text-bodydark2 opacity-40" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="{{ icon_path }}" />
            {% if icon_path2 %}<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="{{ icon_path2 }}" />{% endif %}
        </svg>
    </div>
    <h3 class="mb-2 text-xl font-bold text-black dark:text-white">{{ title }}</h3>
    <p class="max-w-sm text-sm font-medium text-bodydark2">{{ message }}</p>
</div>
