{% load static %}
{% load i18n %}

<aside id="sidebar"
       class="group absolute left-0 top-0 z-9999 flex h-screen w-72.5 flex-col overflow-y-hidden bg-white duration-300 ease-linear dark:bg-boxdark lg:static lg:translate-x-0 -translate-x-full border-r border-stroke dark:border-strokedark [.collapsed&]:w-20 transition-all">
    <!-- SIDEBAR HEADER -->
    <div class="flex items-center justify-between gap-2 px-6 py-5.5 lg:py-6.5 transition-all group-[.collapsed]:justify-center group-[.collapsed]:px-0">
        <a href="{% url 'apps.dashboard:index' %}" class="flex items-center gap-3">
            <img src="{% if site.logo %}{{ site.logo.url }}{% else %}{% static 'assets/images/logos/logo.png' %}{% endif %}" alt="Logo" class="h-8 block group-[.collapsed]:hidden flex-shrink-0" />
            <img src="{% static 'assets/images/logos/logo-short.png' %}" alt="Logo" class="h-8 hidden group-[.collapsed]:block flex-shrink-0" />
        </a>

        <div class="flex items-center gap-2 group-[.collapsed]:hidden">
            <!-- Desktop Toggle -->
            <button id="sidebar-toggle-aside" class="hidden lg:block text-gray-500 hover:text-primary transition-colors">
                <svg class="fill-current rotate-180 transition-transform duration-300" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M13.2 15.8L7.4 10L13.2 4.2L11.8 2.8L4.6 10L11.8 17.2L13.2 15.8Z" />
                </svg>
            </button>

            <!-- Mobile Close -->
            <button id="sidebar-close" class="block lg:hidden text-gray-500 hover:text-primary">
                <svg class="fill-current" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 3.3L16.7 1L10 7.7L3.3 1L1 3.3L7.7 10L1 16.7L3.3 19L10 12.3L16.7 19L19 16.7L12.3 10L19 3.3Z" />
                </svg>
            </button>
        </div>
    </div>
    <!-- SIDEBAR HEADER -->

    <div class="no-scrollbar flex flex-col overflow-y-auto duration-300 ease-linear flex-grow px-4 py-4 lg:px-6 transition-all group-[.collapsed]:px-2">
        <!-- Sidebar Menu -->
        <nav>
            <!-- Menu Group -->
            <div>
                <h3 class="mb-4 ml-4 text-xs font-semibold text-gray-500 uppercase tracking-wider group-[.collapsed]:hidden">
                    {% trans "Main Menu" %}
                </h3>

                <ul class="mb-6 flex flex-col gap-1.5">
                    <!-- Menu Item Dashboard -->
                    <li>
                        <a class="flex items-center gap-2.5 rounded-sm py-2 px-4 font-medium text-gray-600 dark:text-bodydark1 duration-300 ease-in-out hover:bg-gray-2 dark:hover:bg-meta-4 transition-all group-[.collapsed]:justify-center group-[.collapsed]:px-0 {% if request.resolver_match.url_name == 'index' and 'dashboard' in request.path %}bg-gray-2 dark:bg-meta-4 !text-primary{% endif %}"
                           href="{% url 'apps.dashboard:index' %}" title="{% trans 'Dashboard' %}">
                            <svg class="fill-current flex-shrink-0" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1.66666 4.16667C1.66666 3.24619 2.41285 2.5 3.33332 2.5H7.49999C8.42047 2.5 9.16666 3.24619 9.16666 4.16667V7.5C9.16666 8.42048 8.42047 9.16667 7.49999 9.16667H3.33332C2.41285 9.16667 1.66666 8.42048 1.66666 7.5V4.16667Z" />
                                <path d="M1.66666 12.5C1.66666 11.5795 2.41285 10.8333 3.33332 10.8333H7.49999C8.42047 10.8333 9.16666 11.5795 9.16666 12.5V15.8333C9.16666 16.7538 8.42047 17.5 7.49999 17.5H3.33332C2.41285 17.5 1.66666 16.7538 1.66666 15.8333V12.5Z" />
                                <path d="M10.8333 4.16667C10.8333 3.24619 11.5795 2.5 12.5 2.5H16.6667C17.5871 2.5 18.3333 3.24619 18.3333 4.16667V7.5C18.3333 8.42048 17.5871 9.16667 16.6667 9.16667H12.5C11.5795 9.16667 10.8333 8.42048 10.8333 7.5V4.16667Z" />
                                <path d="M10.8333 12.5C10.8333 11.5795 11.5795 10.8333 12.5 10.8333H16.6667C17.5871 10.8333 18.3333 11.5795 18.3333 12.5V15.8333C18.3333 16.7538 17.5871 17.5 16.6667 17.5H12.5C11.5795 17.5 10.8333 16.7538 10.8333 15.8333V12.5Z" />
                            </svg>
                            <span class="group-[.collapsed]:hidden duration-300 ease-in-out overflow-hidden whitespace-nowrap">{% trans "Dashboard" %}</span>
                        </a>
                    </li>

                    {% if perms.users.view_account %}
                    <li class="group-[.collapsed]:hidden">
                        <h3 class="mb-4 ml-4 mt-8 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            {% trans "Administration" %}
                        </h3>
                    </li>
                    <li>
                        <a class="flex items-center gap-2.5 rounded-sm py-2 px-4 font-medium text-gray-600 dark:text-bodydark1 duration-300 ease-in-out hover:bg-gray-2 dark:hover:bg-meta-4 transition-all group-[.collapsed]:justify-center group-[.collapsed]:px-0 {% if "accounts" in request.path %}bg-gray-2 dark:bg-meta-4 !text-primary{% endif %}"
                           href="{% url 'apps.users:account_list' %}" title="{% trans 'Accounts' %}">
                            <svg class="fill-current flex-shrink-0" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M10 10C12.3012 10 14.1667 8.13452 14.1667 5.83333C14.1667 3.53215 12.3012 1.66667 10 1.66667C7.69882 1.66667 5.83334 3.53215 5.83334 5.83333C5.83334 8.13452 7.69882 10 10 10Z" />
                                <path d="M10 11.6667C6.77834 11.6667 4.16667 14.2783 4.16667 17.5C4.16667 17.9602 4.53977 18.3333 5 18.3333H15C15.4602 18.3333 15.8333 17.9602 15.8333 17.5C15.8333 14.2783 13.2217 11.6667 10 11.6667Z" />
                            </svg>
                            <span class="group-[.collapsed]:hidden duration-300 ease-in-out overflow-hidden whitespace-nowrap">{% trans "Accounts" %}</span>
                        </a>
                    </li>
                    {% endif %}
                </ul>
            </div>
        </nav>
        <!-- Sidebar Menu -->
    </div>

    <!-- Sidebar Footer / Bottom Actions -->
    <div class="p-6 border-t border-stroke dark:border-strokedark group-[.collapsed]:p-4 group-[.collapsed]:flex group-[.collapsed]:justify-center transition-all">
        <span class="text-xs font-medium text-gray-500 group-[.collapsed]:hidden">v1.0.0</span>
        <div class="hidden group-[.collapsed]:block">
            <span class="text-[10px] font-bold text-gray-500">v1</span>
        </div>
    </div>
</aside>
