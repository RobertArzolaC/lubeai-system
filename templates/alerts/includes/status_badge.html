{% load i18n %}

{% if status == "OPEN" %}
<span class="inline-flex items-center gap-1.5 rounded-full border border-danger/20 bg-danger/10 py-1.5 px-3.5 text-xs font-bold text-danger">
    <span class="h-1.5 w-1.5 rounded-full bg-danger" aria-hidden="true"></span>{% trans "Open" %}
</span>
{% elif status == "ACKNOWLEDGED" %}
<span class="inline-flex items-center gap-1.5 rounded-full border border-warning/20 bg-warning/10 py-1.5 px-3.5 text-xs font-bold text-warning">
    <span class="h-1.5 w-1.5 rounded-full bg-warning" aria-hidden="true"></span>{% trans "Acknowledged" %}
</span>
{% elif status == "RESOLVED" %}
<span class="inline-flex items-center gap-1.5 rounded-full border border-success/20 bg-success/10 py-1.5 px-3.5 text-xs font-bold text-success">
    <span class="h-1.5 w-1.5 rounded-full bg-success" aria-hidden="true"></span>{% trans "Resolved" %}
</span>
{% else %}
<span class="inline-flex items-center gap-1.5 rounded-full border border-stroke bg-gray-2 py-1.5 px-3.5 text-xs font-bold text-bodydark2 dark:border-strokedark dark:bg-meta-4">
    <span class="h-1.5 w-1.5 rounded-full bg-bodydark2" aria-hidden="true"></span>{% trans "Dismissed" %}
</span>
{% endif %}
